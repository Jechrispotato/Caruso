<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caruso</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Caruso</h1>
                <p>Simple Photo Collager</p>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Top Photo</label>
                    <button id="upload-top" class="btn primary-btn">Choose Image</button>
                    <input type="file" id="file-top" accept="image/*" style="display: none;">
                </div>
                
                <div class="control-group">
                    <label>Bottom Photo</label>
                    <button id="upload-bottom" class="btn primary-btn">Choose Image</button>
                    <input type="file" id="file-bottom" accept="image/*" style="display: none;">
                </div>
                
                <div class="spacer"></div>
                
                <div class="control-group">
                    <label>Export Resolution</label>
                    <select id="export-resolution" class="select-input">
                        <option value="1">Default (1080 x 1350)</option>
                        <option value="2">2K (2160 x 2700)</option>
                        <option value="4">4K (4320 x 5400)</option>
                    </select>
                </div>

                <div class="control-group">
                    <button id="btn-export" class="btn export-btn">Export Collage</button>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="canvas-wrapper">
                <canvas id="collage-canvas" width="1080" height="1350"></canvas>
            </div>
        </main>
    </div>
    
    <script src="renderer.js"></script>
</body>
</html>
